<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>🗺️ 雲南滇西12日 · 地圖</title>

    <!-- Leaflet.js CSS + JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #F8F4F0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .map-header {
            background: linear-gradient(145deg, #2D241A 0%, #3D2E22 100%);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 3px solid #E07A5F;
            z-index: 10;
        }
        .map-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        .map-header .back-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .map-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .map-header .back-btn:active {
            transform: scale(0.94);
        }

        #map {
            flex: 1;
            width: 100%;
            background: #e8e0d8;
            z-index: 1;
        }

        .legend {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
            z-index: 1000;
            font-size: 0.8rem;
            border: 1px solid rgba(0, 0, 0, 0.04);
            min-width: 110px;
        }
        .legend .row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 3px 0;
        }
        .legend .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1.5px solid rgba(0, 0, 0, 0.08);
        }
        .legend .color-dot.hotel {
            background: #2B6A9E;
        }
        .legend .color-dot.attraction {
            background: #D94A4A;
        }
        .legend .label {
            color: #2D241A;
            font-weight: 500;
        }

        .map-footer {
            text-align: center;
            font-size: 0.6rem;
            color: #B0A090;
            padding: 6px 0;
            background: #fff;
            border-top: 1px solid #EDE7E0;
            flex-shrink: 0;
            z-index: 10;
        }

        @media (max-width: 480px) {
            .map-header h1 {
                font-size: 0.9rem;
            }
            .map-header .back-btn {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .legend {
                bottom: 16px;
                right: 12px;
                padding: 10px 14px;
                font-size: 0.7rem;
                min-width: 90px;
            }
            .legend .color-dot {
                width: 12px;
                height: 12px;
            }
        }
    </style>
</head>

            fadeAnimation: true,

        // ================================================================

        // ================================================================

        // ================================================================

                    width: ${size || 14}px;
                    height: ${size || 14}px;
                    background: ${color};
                    border-radius: 50%;
                    border: 2.5px solid #fff;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.20);
                "></div>`,
                iconSize: [size || 14, size || 14],
                iconAnchor: [(size || 14) / 2, (size || 14) / 2],
                popupAnchor: [0, -(size || 14) / 2 - 4]
            });
        }

        const hotelIcon = createMarkerIcon('#2B6A9E', 16);
        const attractionIcon = createMarkerIcon('#D94A4A', 14);

            }
        ];

        // ================================================================
        //  5. 將地點加入地圖
        // ================================================================
        locations.forEach(loc => {
            const icon = loc.type === 'hotel' ? hotelIcon : attractionIcon;
            const marker = L.marker([loc.lat, loc.lng], { icon: icon })
                .addTo(map)
                .bindPopup(`
                    <div style="font-size:0.9rem; font-weight:600; color:#2D241A;">
                        ${loc.name}
                    </div>
                    <div style="font-size:0.75rem; color:#6B5A4A; margin-top:2px;">
                        ${loc.day} ｜ ${loc.desc}
                    </div>
                `);
        });

        // ================================================================
        //  6. 加入圖例
        // ================================================================
        const legend = document.createElement('div');
        legend.className = 'legend';
        legend.innerHTML = `
            <div class="row"><span class="color-dot hotel"></span><span class="label">🏨 住宿</span></div>
            <div class="row"><span class="color-dot attraction"></span><span class="label">📍 景點</span></div>
        `;
        document.body.appendChild(legend);

        // ================================================================
        //  7. 地圖適應視窗
        // ================================================================
        setTimeout(() => {
            map.invalidateSize();
        }, 200);

        console.log('🗺️ 雲南地圖已載入！（共 ' + locations.length + ' 個地點）');
