<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>🗺️ 雲南滇西12日 · 地圖</title>

    <!-- Leaflet.js CSS + JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #F8F4F0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .map-header {
            background: linear-gradient(145deg, #2D241A 0%, #3D2E22 100%);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 3px solid #E07A5F;
            z-index: 10;
        }
        .map-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        .map-header .back-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .map-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .map-header .back-btn:active {
            transform: scale(0.94);
        }

        /* ===== MAP CONTAINER ===== */
        #map {
            flex: 1;
            width: 100%;
            background: #e8e0d8;
            z-index: 1;
        }

        /* ===== CUSTOM LEGEND ===== */
        .legend {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
            z-index: 1000;
            font-size: 0.8rem;
            border: 1px solid rgba(0, 0, 0, 0.04);
            min-width: 110px;
        }
        .legend .row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 3px 0;
        }
        .legend .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1.5px solid rgba(0, 0, 0, 0.08);
        }
        .legend .color-dot.hotel {
            background: #2B6A9E;
        }
        .legend .color-dot.attraction {
            background: #D94A4A;
        }
        .legend .label {
            color: #2D241A;
            font-weight: 500;
        }

        /* ===== FOOTER ===== */
        .map-footer {
            text-align: center;
            font-size: 0.6rem;
            color: #B0A090;
            padding: 6px 0;
            background: #fff;
            border-top: 1px solid #EDE7E0;
            flex-shrink: 0;
            z-index: 10;
        }

        @media (max-width: 480px) {
            .map-header h1 {
                font-size: 0.9rem;
            }
            .map-header .back-btn {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .legend {
                bottom: 16px;
                right: 12px;
                padding: 10px 14px;
                font-size: 0.7rem;
                min-width: 90px;
            }
            .legend .color-dot {
                width: 12px;
                height: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="map-header">
        <h1>🗺️ 雲南滇西12日 · 行程地圖</h1>
        <a href="index.html" class="back-btn">← 返回行程</a>
    </header>

    <!-- ===== MAP ===== -->
    <div id="map"></div>

    <!-- ===== LEGEND (用 JavaScript 加入) ===== -->

    <div class="map-footer">📍 藍色 = 住宿 ｜ 紅色 = 景點 ｜ 撳 Marker 睇詳情</div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        //  1. 初始化地圖
        // ================================================================
        const map = L.map('map', {
            center: [26.5, 100.5],
            zoom: 7,
            zoomControl: true,
            fadeAnimation: true,
            attributionControl: true
        });

        // ================================================================
        //  2. 底圖（OpenStreetMap）
        // ================================================================
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // ================================================================
        //  3. 自訂 Marker 圖標
        // ================================================================
        function createMarkerIcon(color, size) {
            return L.divIcon({
                className: 'custom-marker',
                html: `<div style="
                    width: ${size || 14}px;
                    height: ${size || 14}px;
                    background: ${color};
                    border-radius: 50%;
                    border: 2.5px solid #fff;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.20);
                "></div>`,
                iconSize: [size || 14, size || 14],
                iconAnchor: [(size || 14) / 2, (size || 14) / 2],
                popupAnchor: [0, -(size || 14) / 2 - 4]
            });
        }

        const hotelIcon = createMarkerIcon('#2B6A9E', 16);
        const attractionIcon = createMarkerIcon('#D94A4A', 14);

        // ================================================================

        // ================================================================
        const locations = [

            // ===== 酒店（藍色） =====
            {

                desc: '昆明機場附近'
            },
            {

            {

            },
            {
                name: '🏨 香格里拉（待定）',
                lat: 27.829,
                lng: 99.704,

            },
            {

            },
            {

                lat: 27.857,
                lng: 99.638,

                day: 'Day 10',
                desc: '候鳥棲息·環湖'
            },
            {

                lat: 27.868,

                type: 'attraction',
                day: 'Day 10',

            },
            {
                name: '📍 翠湖公園',
                lat: 25.054,
                lng: 102.703,
                type: 'attraction',
                day: 'Day 12',
                desc: '紅嘴鷗·免費'
            },
            {
                name: '📍 雲南大學（可選）',
                lat: 25.056,
                lng: 102.706,
                type: 'attraction',
                day: 'Day 12',
                desc: '百年校園'
            }
        ];

        // ================================================================
        //  5. 將地點加入地圖
        // ================================================================
        locations.forEach(loc => {
            const icon = loc.type === 'hotel' ? hotelIcon : attractionIcon;
            const marker = L.marker([loc.lat, loc.lng], { icon: icon })
                .addTo(map)
                .bindPopup(`
                    <div style="font-size:0.9rem; font-weight:600; color:#2D241A;">
                        ${loc.name}
                    </div>
                    <div style="font-size:0.75rem; color:#6B5A4A; margin-top:2px;">
                        ${loc.day} ｜ ${loc.desc}
                    </div>
                `);
        });

        // ================================================================
        //  6. 加入圖例
        // ================================================================
        const legend = document.createElement('div');
        legend.className = 'legend';
        legend.innerHTML = `
            <div class="row"><span class="color-dot hotel"></span><span class="label">🏨 住宿</span></div>
            <div class="row"><span class="color-dot attraction"></span><span class="label">📍 景點</span></div>
        `;
        document.body.appendChild(legend);

        // ================================================================
        //  7. 地圖適應視窗
        // ================================================================
        setTimeout(() => {
            map.invalidateSize();
        }, 200);

        console.log('🗺️ 雲南地圖已載入！（座標已修正）');
    </script>

</body>
</html>
