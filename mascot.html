<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金陵小導遊 - 第一階段</title>
    <style>
        /* 基本設定 */
        body { margin: 0; padding: 0; background-color: #f4f4f4; height: 200vh; }
        
        /* 舞台：固定喺全個螢幕，唔阻礙其他內容 */
        .mascot-stage {
            position: fixed;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            top: 0; left: 0;
        }
        
        /* 共用元素樣式 */
        .mascot-stage img, .mascot-stage video {
            position: absolute;
            width: 180px; /* 手機上嘅大細，可自行調校 */
        }

        /* 靜態圖片（預設喺右邊） */
        #girl-idle {
            right: 20px;
            bottom: 20px;
            display: block;
        }

        /* 影片動畫（預設隱藏） */
        .mascot-anim {
            display: none;
            opacity: 1;
        }

        /* 動作：Say Hi (留意影片自帶的朝向) */
        #sayhi-video {
            right: 20px;
            bottom: 20px;
        }

        /* 動作：探頭揮手 Wave (設喺右邊邊框外，模擬探頭) */
        #wave-video {
            right: -50px; 
            bottom: 20px;
        }

        /* 動作：行路 Walk (設喺左邊邊框外) */
        #walk-video {
            left: -200px;
            bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- 舞台結構 -->
    <div class="mascot-stage">
        <!-- 1. 靜止狀態 (預設顯示) -->
        <img id="girl-idle" src="mascot/girl-idle.png">
        
        <!-- 2. Say Hi 影片 -->
        <video id="sayhi-video" class="mascot-anim" src="mascot/girl-sayhi.webm" playsinline muted></video>
        
        <!-- 3. Wave 探頭揮手影片 -->
        <video id="wave-video" class="mascot-anim" src="mascot/girl-wave.webm" playsinline muted></video>
        
        <!-- 4. Walk 行路影片 -->
        <video id="walk-video" class="mascot-anim" src="mascot/girl-walk.webm" playsinline muted></video>
    </div>

    <script>
        // 攞晒所有元素
        const idleImg = document.getElementById('girl-idle');
        const sayhiVideo = document.getElementById('sayhi-video');
        const waveVideo = document.getElementById('wave-video');
        const walkVideo = document.getElementById('walk-video');

        // 輔助函數：顯示影片，隱藏圖片；或者反轉
        function showVideo(video) {
            idleImg.style.display = 'none';
            sayhiVideo.style.display = 'none';
            waveVideo.style.display = 'none';
            walkVideo.style.display = 'none';
            
            video.style.display = 'block';
            video.currentTime = 0; // 由頭開始播
            video.play();
        }

        function showIdle() {
            sayhiVideo.style.display = 'none';
            waveVideo.style.display = 'none';
            walkVideo.style.display = 'none';
            idleImg.style.display = 'block';
        }

        // ---------- 動作 1：進入網站，Say Hi，回復靜止 ----------
        sayhiVideo.addEventListener('ended', () => {
            showIdle();
        });

        setTimeout(() => {
            showVideo(sayhiVideo);
        }, 1000); // 1秒後出現打招呼


        // ---------- 動作 2：瀏覽一陣，右邊探頭揮手，收返去 ----------
        waveVideo.addEventListener('ended', () => {
            showIdle();
        });

        setTimeout(() => {
            showVideo(waveVideo);
            // 影片會由右邊邊框外探出嚟，順帶用CSS令佢滑入
            waveVideo.style.transition = 'right 1s ease-out';
            waveVideo.style.right = '20px';
            
            // 揮完手之後，收返去
            setTimeout(() => {
                waveVideo.style.right = '-50px';
            }, 3000); // 假設揮手影片約3秒

        }, 8000); // 8秒後瀏覽一陣，開始揮手


        // ---------- 動作 3：適當時機，由左向右散步 ----------
        walkVideo.addEventListener('ended', () => {
            // 行完路後消失（或者可以顯示返 idle 都得）
            walkVideo.style.display = 'none';
        });

        setTimeout(() => {
            showVideo(walkVideo);
            
            // 用JS控制位置，由最左邊行去最右邊
            walkVideo.style.transition = 'left 5s linear'; // 5秒行完
            walkVideo.style.left = '100vw'; // 行到最右邊

        }, 15000); // 15秒後開始行路
    </script>
</body>
</html>
