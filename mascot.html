<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金陵小導遊 - 互動吉祥物</title>
    <style>
        /* 基本設定，令網頁冇白邊 */
        body { margin: 0; padding: 0; background-color: #f4f4f4; height: 200vh; }
        
        /* 舞台：喺螢幕最頂層，唔阻礙其他內容 */
        .mascot-stage {
            position: fixed;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            top: 0; left: 0;
        }
        
        /* 吉祥物本體 */
        .mascot {
            position: absolute;
            width: 180px;
            right: -200px;
            bottom: 20px;
            transition: all 0.5s ease;
        }

        /* 對話氣泡 */
        #speech-bubble {
            position: absolute;
            background: #fff;
            border: 2px solid #d9534f;
            border-radius: 20px;
            padding: 10px 15px;
            font-family: sans-serif;
            font-weight: bold;
            color: #333;
            display: none;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        /* ========== 動畫區 ========== */
        /* 動作1：左邊行到右邊 */
        @keyframes walk-across {
            0% { left: -200px; }
            100% { left: 100vw; }
        }

        /* 動作2：右邊Say Hi */
        @keyframes say-hi {
            0% { right: -200px; }
            60% { right: 20px; transform: rotate(-5deg); }
            75% { right: 30px; transform: rotate(5deg); }
            100% { right: 20px; transform: rotate(0deg); }
        }

        /* 動作3：中間跳出擺Pose */
        @keyframes pop-out {
            0% { transform: scale(0) translateY(50px); opacity: 0; }
            70% { transform: scale(1.2) translateY(-20px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* 動作4：Header爬出嚟 */
        @keyframes climb-header {
            0% { top: -150px; opacity: 0; }
            100% { top: 10px; opacity: 1; }
        }

        /* 動作4：坐底踢踢腳 (用CSS模擬左右搖擺) */
        @keyframes kick-feet {
            0% { transform: rotate(-10deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <!-- 舞台結構 -->
    <div class="mascot-stage">
        <div id="speech-bubble">嗨！準備好出發未？</div>
        <img id="girl" src="girl-walk.png" class="mascot">
    </div>

    <script>
        const girl = document.getElementById('girl');
        const bubble = document.getElementById('speech-bubble');

        // 動作 1：由左邊行到右邊
        function walkAcross() {
            // 重置狀態
            girl.style.right = 'auto';
            girl.style.top = 'auto';
            girl.style.left = '-200px';
            girl.style.bottom = '20px';
            girl.src = "girl-walk.png"; // 使用行路圖
            girl.style.animation = "walk-across 5s linear forwards";
            setTimeout(() => { girl.style.animation = ''; }, 5000);
        }

        // 動作 2：右邊邊框伸出嚟Say Hi
        function sayHi() {
            girl.src = "girl-pose.png"; // 如果未準備呢張圖，可以改返做 "girl-walk.png"
            girl.style.left = 'auto';
            girl.style.top = '40%';
            girl.style.bottom = 'auto';
            girl.style.right = '-180px';
            girl.style.animation = "say-hi 1.5s ease-out forwards";
            
            // 顯示氣泡講嘢
            bubble.style.display = 'block';
            bubble.style.right = '210px';
            bubble.style.top = '35%';
            bubble.innerHTML = "嗨！歡迎嚟到南京！";

            // 3秒後收起氣泡
            setTimeout(() => { bubble.style.display = 'none'; }, 3000);
        }

        // 動作 3：中間跳出嚟擺Pose影相
        function popPose() {
            girl.src = "girl-pose.png"; 
            girl.style.left = "50%";
            girl.style.top = "30%";
            girl.style.right = "auto";
            girl.style.bottom = "auto";
            girl.style.animation = "pop-out 1.2s ease-out forwards";
            
            // 停留3秒後消失
            setTimeout(() => { girl.style.opacity = "0"; }, 3000);
            setTimeout(() => { girl.style.opacity = "1"; }, 3500);
        }

        // 動作 4：Header位置爬出嚟，坐底踢踢腳
        function climbAndKick() {
            girl.src = "girl-pose.png"; 
            girl.style.left = "50px";
            girl.style.top = "10px"; // 喺頂部
            girl.style.right = "auto";
            girl.style.bottom = "auto";
            girl.style.opacity = "1";
            
            // 先爬出嚟
            girl.style.animation = "climb-header 2s ease-out forwards";
            
            // 爬完之後，開始坐底踢腳（左右搖擺）
            setTimeout(() => {
               girl.style.animation = "kick-feet 0.6s ease-in-out infinite";
               // 踢5秒之後停低
               setTimeout(() => { girl.style.animation = ''; }, 5000);
            }, 2000);
        }

        // 自動演示（你可以將呢幾行刪除，改為喺網頁其他位置用按鈕控制）
        // 網頁載入1秒後行路，7秒後Say Hi，12秒後跳出Pose，18秒後爬出踢腳
        setTimeout(walkAcross, 1000);
        setTimeout(sayHi, 7000);
        setTimeout(popPose, 12000);
        setTimeout(climbAndKick, 17000);
    </script>
</body>
</html>
