<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>雲南滇西12日 · 4人同行</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>

    <!-- 共用樣式 -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header" id="heroHeader">
        <div class="header-overlay"></div>
        <div class="header-content">
            <h1>🌄 雲南滇西12日 · 4人同行</h1>
            <div class="countdown" id="countdown">⏳ 載入中...</div>
            <div class="header-divider">
                <span class="dot"></span>
                <span class="line"></span>
                <span class="dot"></span>
            </div>
            <div class="sub">2026.11.11 – 11.22 ｜ Chill · Hea · 慢慢行</div>
        </div>
    </header>

    <!-- ===== TAB NAV ===== -->
    <nav class="tab-nav">
        <a href="index.html" class="active">📋 行程總覽</a>
        <a href="daily.html">📅 每日行程</a>
        <a href="info.html">📌 重要資訊</a>
    </nav>

    <!-- ===== PAGE: 行程總覽 ===== -->
    <div class="page">
        <div class="overview-card">
            <h2>🗺️ 12日行程動線</h2>
            <table class="route-table">
                <thead>
                    <tr>
                        <th>Day</th>
                        <th>日期</th>
                        <th>行程</th>
                        <th>住宿地點</th>
                    </tr>
                </thead>
                <tbody id="routeTableBody"></tbody>
            </table>
            <div style="font-size:0.7rem;color:#8A7A6A;margin-top:8px;">💡 住宿確認狀態及酒店名稱請到「重要資訊」頁面修改</div>
        </div>

        <!-- 天氣小工具 -->
        <div class="overview-card" id="weatherCard">
            <h2>☀️ 今日天氣</h2>
            <div id="weatherContainer">
                <div class="weather-loading">⏳ 載入天氣中...</div>
            </div>
        </div>

        <!-- 私人導遊入口 -->
        <div class="overview-card" style="margin-top:14px;">
            <h2 style="font-size:1.05rem; color:#E07A5F; border-left:5px solid #E9C46A; padding-left:12px; margin-bottom:10px;">🤠 私人導遊</h2>
            <a href="guide.html" style="text-decoration:none; display:block;">
                <div class="weather-card" style="cursor:pointer; transition:transform 0.15s; background: linear-gradient(145deg, #2D4A6A, #1E3A5A); border-radius:16px; padding:16px 20px; color:#fff; display:flex; align-items:center; box-shadow:0 2px 12px rgba(0,0,0,0.08);">
                    <div>
                        <div style="font-size:1.0rem; font-weight:600; letter-spacing:0.5px;">「每個景點背後，都有段故事等緊你。」</div>
                        <div style="font-size:0.8rem; opacity:0.8; margin-top:2px;">歷史 · 傳說 · 習俗 · 打卡位 · 避坑 · 美食</div>
                    </div>
                </div>
            </a>
        </div>

        <div class="footer-bar">📌 詳細行程及備註請到「每日行程」頁</div>
    </div>

    <!-- ===== 底部海拔線 ===== -->
    <div class="altitude-footer" id="altitudeFooter">
        <canvas id="altitudeCanvas"></canvas>
    </div>

    <!-- ===== 固定地圖按鈕 ===== -->
    <a href="map.html" class="map-fab" id="mapFab" aria-label="查看地圖">
        🗺️
        <span class="tooltip">查看地圖</span>
    </a>

    <!-- ===== Toast 容器 ===== -->
    <div class="toast-container" id="toastContainer">
        <span class="toast-icon" id="toastIcon">🏔️</span>
        <div class="toast-title" id="toastTitle">Day 8 · 香格里拉</div>
        <div class="toast-sub" id="toastSub">3,300m</div>
        <div class="toast-tip" id="toastTip">💡 今晚唔好沖涼住啦～</div>
    </div>

    <!-- ===== 共用 JavaScript ===== -->
    <script src="app.js"></script>
    <script>
        // 頁面專屬初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderRouteTable();
            fetchWeather();
            // 倒數計時已在 app.js 啟動
        });
    </script>

<!-- ===== 返回頂部按鈕 ===== -->
<button class="back-to-top" id="backToTopBtn" aria-label="返回頂部">⬆</button>

</body>
</html>
