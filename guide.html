<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>📖 雲南滇西 · 導遊筆記</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #F8F4F0;
            color: #2D241A;
            padding-bottom: 30px;
            min-height: 100vh;
        }

        .guide-header {
            background: linear-gradient(145deg, #2D241A 0%, #3D2E22 100%);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 16px 20px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #E07A5F;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.15);
        }
        .guide-header .back-btn {
            color: #E9C46A;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1.5px solid rgba(233, 196, 106, 0.3);
            transition: 0.2s;
        }
        .guide-header .back-btn:active {
            transform: scale(0.94);
            background: rgba(233, 196, 106, 0.1);
        }
        .guide-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        .region-section {
            max-width: 720px;
            margin: 0 auto;
            padding: 16px 16px 8px;
        }
        .region-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #E07A5F;
            border-left: 5px solid #E9C46A;
            padding-left: 14px;
            margin-bottom: 6px;
        }
        .region-intro {
            font-size: 0.9rem;
            color: #6B5A4A;
            padding-left: 19px;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .spot-card {
            background: #fff;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: 0.2s;
        }
        .spot-card-header {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s;
        }
        .spot-card-header:active {
            background: #F5F0EB;
        }
        .spot-card-header .spot-name {
            font-size: 1.0rem;
            font-weight: 600;
            color: #2D241A;
        }
        .spot-card-header .spot-toggle {
            font-size: 1.2rem;
            color: #B0A090;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            margin-left: 12px;
        }
        .spot-card-header .spot-toggle.open {
            transform: rotate(180deg);
        }

        .spot-card-body {
            padding: 0 18px 18px;
            display: none;
            border-top: 1px solid #EDE7E0;
        }
        .spot-card-body.open {
            display: block;
        }

        .spot-card-body .section {
            margin-top: 14px;
        }
        .spot-card-body .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #8A7A6A;
            margin-bottom: 4px;
        }
        .spot-card-body .section-content {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #2D241A;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .spot-card-body .section-content ul {
            list-style: none;
            padding-left: 6px;
        }
        .spot-card-body .section-content ul li {
            padding: 3px 0 3px 18px;
            position: relative;
        }
        .spot-card-body .section-content ul li::before {
            content: "•";
            position: absolute;
            left: 2px;
            color: #E07A5F;
        }

        .note-section {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 2px dashed #EDE7E0;
        }
        .note-section .note-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #6B5A4A;
            margin-bottom: 6px;
        }
        .note-section .note-input-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .note-section .note-input-row input {
            flex: 2 1 180px;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1.5px solid #EDE7E0;
            font-size: 0.85rem;
            background: #FFFBF5;
            outline: none;
            transition: 0.15s;
        }
        .note-section .note-input-row input:focus {
            border-color: #E07A5F;
        }
        .note-section .note-input-row button {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            background: #E07A5F;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .note-section .note-input-row button:active {
            transform: scale(0.94);
            background: #C96A50;
        }

        .note-list {
            margin-top: 8px;
        }
        .note-list .note-item {
            background: #FEF9E7;
            border-radius: 10px;
            padding: 6px 12px;
            margin: 4px 0;
            font-size: 0.88rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #E9C46A;
        }
        .note-list .note-item .note-text {
            flex: 1;
            color: #2D241A;
        }
        .note-list .note-item .del-btn {
            background: none;
            border: none;
            color: #C07A5A;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0 4px;
            opacity: 0.6;
        }
        .note-list .note-item .del-btn:active {
            opacity: 1;
            transform: scale(1.2);
        }
        .note-list .empty-msg {
            color: #B0A090;
            font-size: 0.8rem;
            font-style: italic;
            padding: 4px 0 2px 6px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6B5A4A;
            font-size: 1rem;
        }
        .loading .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #EDE7E0;
            border-top-color: #E07A5F;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .guide-footer {
            text-align: center;
            font-size: 0.7rem;
            color: #B0A090;
            padding: 20px 16px 10px;
            border-top: 1px solid #EDE7E0;
            margin-top: 10px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-log {
            background: #fff3f0;
            border-radius: 12px;
            padding: 12px 16px;
            margin: 10px 16px;
            font-size: 0.8rem;
            color: #A3512B;
            border-left: 4px solid #E07A5F;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }
        .error-log .error-item {
            padding: 2px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .error-log .error-item:last-child {
            border-bottom: none;
        }

        /* ===== 返回頂部按鈕 ===== */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 20px;
            z-index: 60;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #2B3A67;
            color: #fff;
            border: none;
            box-shadow: 0 4px 20px rgba(43, 58, 103, 0.35), 0 2px 8px rgba(0, 0, 0, 0.10);
            font-size: 1.6rem;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(2px);
            border: 2px solid rgba(255, 255, 255, 0.12);
            line-height: 1;
        }
        .back-to-top.show {
            display: flex;
        }
        .back-to-top:active {
            transform: scale(0.90);
            box-shadow: 0 2px 12px rgba(43, 58, 103, 0.25);
        }
        @media (max-width: 480px) {
            .back-to-top {
                bottom: 20px;
                right: 14px;
                width: 48px;
                height: 48px;
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .guide-header h1 {
                font-size: 0.9rem;
            }
            .guide-header .back-btn {
                font-size: 0.75rem;
                padding: 3px 10px;
            }
            .region-title {
                font-size: 1.2rem;
            }
            .spot-card-header .spot-name {
                font-size: 0.92rem;
            }
            .spot-card-body .section-content {
                font-size: 0.87rem;
            }
            .note-section .note-input-row input {
                font-size: 0.8rem;
                padding: 6px 12px;
            }
            .note-section .note-input-row button {
                font-size: 0.8rem;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="guide-header">
        <a href="index.html" class="back-btn">← 返回行程</a>
        <h1>📖 導遊筆記</h1>
        <span style="width:80px;"></span>
    </header>

    <!-- ===== 內容 ===== -->
    <div id="guideContainer">
        <div class="loading">
            <div class="spinner"></div>
            <div>📖 載入導遊筆記中...</div>
        </div>
    </div>

    <div id="errorLog" class="error-log" style="display:none;"></div>

    <div class="guide-footer">✏️ 每個景點都可以加團友筆記 · 4人同步</div>

    <!-- ===== 返回頂部按鈕 ===== -->
    <button class="back-to-top" id="backToTopBtn" aria-label="返回頂部">⬆</button>

    <script>
        // ================================================================
        //  FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAtthBBNoHJkN6B_e8DVjzDpK_eB0wfExo",
            authDomain: "yunnan-trip-d5626.firebaseapp.com",
            databaseURL: "https://yunnan-trip-d5626-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "yunnan-trip-d5626",
            storageBucket: "yunnan-trip-d5626.firebasestorage.app",
            messagingSenderId: "956753515518",
            appId: "1:956753515518:web:ef19ac8a7b45bdf83426af"
        };

        let firebaseInitialized = false;
        try {
            firebase.initializeApp(firebaseConfig);
            firebaseInitialized = true;
        } catch (e) { console.warn('Firebase init error:', e); }
        const db = firebaseInitialized ? firebase.database() : null;

        // ================================================================
        //  工具
        // ================================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getNoteKey(spotId) {
            return `guide-notes/${spotId}`;
        }

        // ================================================================
        //  主程式
        // ================================================================
        const BASE_URL = 'https://raw.githubusercontent.com/pheebssvc-netizen/Yunnan-trip-2026/main/guide-data/';

        async function loadGuideData() {
            const container = document.getElementById('guideContainer');
            const errorLog = document.getElementById('errorLog');
            const errors = [];

            try {
                console.log('📥 載入 _index.json...');
                const indexRes = await fetch(BASE_URL + '_index.json');
                if (!indexRes.ok) {
                    throw new Error(`HTTP ${indexRes.status} - 無法載入 _index.json`);
                }
                const indexData = await indexRes.json();
                const spotList = indexData.景點列表 || [];
                console.log(`✅ 找到 ${spotList.length} 個景點`);

                if (spotList.length === 0) {
                    container.innerHTML = `<div class="loading">⚠️ 景點列表為空</div>`;
                    return;
                }

                const spotPromises = spotList.map(async (meta) => {
                    const url = BASE_URL + meta.id + '.json';
                    try {
                        console.log(`📥 載入 ${meta.id}...`);
                        const res = await fetch(url);
                        if (!res.ok) {
                            errors.push(`⚠️ ${meta.name}（${meta.id}）無法載入（HTTP ${res.status}）`);
                            console.warn(`❌ ${meta.id} 載入失敗: HTTP ${res.status}`);
                            return null;
                        }
                        const data = await res.json();
                        console.log(`✅ ${meta.id} 載入成功`);
                        return data;
                    } catch (e) {
                        errors.push(`❌ ${meta.name}（${meta.id}）載入失敗：${e.message}`);
                        console.warn(`❌ ${meta.id} 載入失敗:`, e.message);
                        return null;
                    }
                });

                const spotDataArray = await Promise.all(spotPromises);
                const validSpots = spotDataArray.filter(d => d !== null);
                console.log(`✅ 成功載入 ${validSpots.length} 個景點，${errors.length} 個失敗`);

                if (validSpots.length === 0) {
                    container.innerHTML = `<div class="loading">⚠️ 無法載入任何景點數據</div>`;
                    if (errors.length) {
                        errorLog.style.display = 'block';
                        errorLog.innerHTML = `<strong>❌ 載入錯誤：</strong>` + errors.map(e =>
                            `<div class="error-item">${e}</div>`
                        ).join('');
                    }
                    return;
                }

                const regions = {};
                validSpots.forEach(spot => {
                    const region = spot.region || '未分類';
                    if (!regions[region]) regions[region] = [];
                    regions[region].push(spot);
                });

                renderRegions(container, regions);

                if (errors.length) {
                    errorLog.style.display = 'block';
                    errorLog.innerHTML = `<strong>⚠️ 部分景點載入失敗：</strong>` + errors.map(e =>
                        `<div class="error-item">${e}</div>`
                    ).join('');
                }

            } catch (error) {
                console.error('載入導遊數據失敗:', error);
                container.innerHTML = `
                    <div class="loading">
                        ⚠️ 載入失敗：${error.message}<br/>
                        <span style="font-size:0.8rem;color:#B0A090;">請檢查網絡或檔案是否存在</span>
                    </div>
                `;
            }
        }

        // ================================================================
        //  渲染
        // ================================================================
        function renderRegions(container, regions) {
            const regionOrder = ['昆明', '大理', '沙溪', '麗江', '瀘沽湖', '香格里拉', '虎跳峽'];
            const sortedRegions = Object.keys(regions).sort((a, b) => {
                const idxA = regionOrder.indexOf(a);
                const idxB = regionOrder.indexOf(b);
                if (idxA === -1) return 1;
                if (idxB === -1) return -1;
                return idxA - idxB;
            });

            let html = '';
            sortedRegions.forEach(regionName => {
                const spots = regions[regionName];
                const regionIntro = spots[0]?.regionIntro || '';

                html += `
                    <div class="region-section">
                        <div class="region-title">🏛️ ${regionName}篇</div>
                        ${regionIntro ? `<div class="region-intro">${escapeHtml(regionIntro)}</div>` : ''}
                `;

                spots.forEach((spot, index) => {
                    const spotId = spot.id || `spot-${index}`;
                    html += renderSpotCard(spot, spotId);
                });

                html += `</div>`;
            });

            container.innerHTML = html;

            // 卡片摺疊
            document.querySelectorAll('.spot-card-header').forEach(header => {
                header.addEventListener('click', function() {
                    const body = this.nextElementSibling;
                    const toggle = this.querySelector('.spot-toggle');
                    if (body.classList.contains('open')) {
                        body.classList.remove('open');
                        toggle.classList.remove('open');
                    } else {
                        body.classList.add('open');
                        toggle.classList.add('open');
                    }
                });
            });

            // 團友筆記提交
            document.querySelectorAll('.note-submit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const spotId = this.dataset.spotId;
                    const input = document.getElementById(`note-input-${spotId}`);
                    const text = input.value.trim();
                    if (!text) { alert('請輸入內容'); return; }
                    if (!db) { alert('❌ Firebase 未連線'); return; }

                    const key = getNoteKey(spotId);
                    db.ref(key).once('value').then(snap => {
                        const notes = snap.val() || [];
                        notes.push({ text, time: Date.now() });
                        db.ref(key).set(notes);
                    });
                    input.value = '';
                });
            });

            // 團友筆記監聽
            document.querySelectorAll('.spot-card').forEach(card => {
                const spotId = card.dataset.spotId;
                if (!spotId || !db) return;
                const key = getNoteKey(spotId);
                const listId = `note-list-${spotId}`;
                const emptyId = `note-empty-${spotId}`;

                db.ref(key).on('value', (snap) => {
                    const notes = snap.val() || [];
                    const list = document.getElementById(listId);
                    const empty = document.getElementById(emptyId);
                    if (!list) return;

                    if (notes.length === 0) {
                        if (empty) empty.style.display = 'block';
                        list.innerHTML = '';
                        return;
                    }
                    if (empty) empty.style.display = 'none';

                    let html = '';
                    notes.forEach((note, idx) => {
                        const text = note.text || '';
                        html += `
                            <div class="note-item">
                                <span class="note-text">${escapeHtml(text)}</span>
                                <button class="del-btn" data-spot="${spotId}" data-idx="${idx}">✕</button>
                            </div>
                        `;
                    });
                    list.innerHTML = html;

                    list.querySelectorAll('.del-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const spot = this.dataset.spot;
                            const idx = parseInt(this.dataset.idx);
                            if (!db) return;
                            const key = getNoteKey(spot);
                            db.ref(key).once('value').then(snap => {
                                const arr = snap.val() || [];
                                arr.splice(idx, 1);
                                db.ref(key).set(arr);
                            });
                        });
                    });
                });
            });
        }

        // ================================================================
        //  渲染單個景點卡片
        // ================================================================
        function renderSpotCard(spot, spotId) {
            const history = spot.歷史 || '暫無歷史資料';
            const legend = spot.傳說 || '暫無相關傳說';
            const custom = spot.習俗 || '暫無習俗資料';
            const photoSpots = spot.打卡位 || [];
            const pitfalls = spot.避坑提醒 || [];
            const foods = spot.美食推薦 || [];

            const photoHtml = photoSpots.length ? `<ul>${photoSpots.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>` :
                '<p style="color:#B0A090;">暫無打卡位資料</p>';
            const pitfallHtml = pitfalls.length ? `<ul>${pitfalls.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>` :
                '<p style="color:#B0A090;">暫無避坑提醒</p>';
            const foodHtml = foods.length ? `<ul>${foods.map(f => `<li>${escapeHtml(f)}</li>`).join('')}</ul>` :
                '<p style="color:#B0A090;">暫無美食推薦</p>';

            return `
                <div class="spot-card" data-spot-id="${spotId}">
                    <div class="spot-card-header">
                        <span class="spot-name">📍 ${escapeHtml(spot.名稱 || '景點')}</span>
                        <span class="spot-toggle">▼</span>
                    </div>
                    <div class="spot-card-body">
                        <div class="section">
                            <div class="section-title">📜 歷史背景</div>
                            <div class="section-content">${escapeHtml(history)}</div>
                        </div>
                        <div class="section">
                            <div class="section-title">📖 傳說／故事</div>
                            <div class="section-content">${escapeHtml(legend)}</div>
                        </div>
                        <div class="section">
                            <div class="section-title">🏮 習俗／文化特色</div>
                            <div class="section-content">${escapeHtml(custom)}</div>
                        </div>
                        <div class="section">
                            <div class="section-title">📸 打卡位</div>
                            <div class="section-content">${photoHtml}</div>
                        </div>
                        <div class="section">
                            <div class="section-title">⚠️ 避坑提醒</div>
                            <div class="section-content">${pitfallHtml}</div>
                        </div>
                        <div class="section">
                            <div class="section-title">🍜 地道美食</div>
                            <div class="section-content">${foodHtml}</div>
                        </div>
                        <div class="note-section">
                            <div class="note-title">✏️ 團友筆記（4人同步）</div>
                            <div class="note-input-row">
                                <input type="text" id="note-input-${spotId}" placeholder="寫低你嘅觀察、感受、補充⋯" />
                                <button class="note-submit-btn" data-spot-id="${spotId}">儲存</button>
                            </div>
                            <div class="note-list" id="note-list-${spotId}"></div>
                            <div class="note-list empty-msg" id="note-empty-${spotId}">💬 未有筆記，你嚟加第一條！</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================================================================
        //  返回頂部功能
        // ================================================================
        const backToTopBtn = document.getElementById('backToTopBtn');

        window.addEventListener('scroll', function() {
            if (window.scrollY > 500) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        });

        backToTopBtn.addEventListener('click', function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // ================================================================
        //  啟動
        // ================================================================
        loadGuideData();
        console.log('📖 導遊筆記已啟動！');
        if (!db) console.warn('⚠️ Firebase 未連線');
        else console.log('✅ Firebase 已連線');
    </script>
