        // ================================================================
        //  主程式
        // ================================================================
        function loadGuideData() {
            const container = document.getElementById('guideContainer');

            // 按地區分組
            const regions = {};
            ALL_SPOTS.forEach(spot => {
                const region = spot.region || '未分類';
                if (!regions[region]) regions[region] = [];
                regions[region].push(spot);
            });

            renderRegions(container, regions);
        }

        // ================================================================
        //  渲染
        // ================================================================
        function renderRegions(container, regions) {
            const regionOrder = ['昆明', '大理', '沙溪', '麗江', '瀘沽湖', '香格里拉', '虎跳峽'];
            const sortedRegions = Object.keys(regions).sort((a, b) => {
                const idxA = regionOrder.indexOf(a);
                const idxB = regionOrder.indexOf(b);
                if (idxA === -1) return 1;
                if (idxB === -1) return -1;
                return idxA - idxB;
            });

            let html = '';
            sortedRegions.forEach(regionName => {
                const spots = regions[regionName];
                const regionIntro = spots[0]?.regionIntro || '';

                html += `
                    <div class="region-section">
                        <div class="region-title">🏛️ ${regionName}篇</div>
                        ${regionIntro ? `<div class="region-intro">${escapeHtml(regionIntro)}</div>` : ''}
                `;

                spots.forEach((spot, index) => {
                    const spotId = spot.id || `spot-${index}`;
                    html += renderSpotCard(spot, spotId);
                });

                html += `</div>`;
            });

            container.innerHTML = html;

            // 卡片摺疊
            document.querySelectorAll('.spot-card-header').forEach(header => {
                header.addEventListener('click', function() {
                    const body = this.nextElementSibling;
                    const toggle = this.querySelector('.spot-toggle');
                    if (body.classList.contains('open')) {
                        body.classList.remove('open');
                        toggle.classList.remove('open');
                    } else {
                        body.classList.add('open');
                        toggle.classList.add('open');
                    }
                });
            });

            // 團友筆記提交
            document.querySelectorAll('.note-submit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const spotId = this.dataset.spotId;
                    const input = document.getElementById(`note-input-${spotId}`);
                    const text = input.value.trim();
                    if (!text) { alert('請輸入內容'); return; }
                    if (!db) { alert('❌ Firebase 未連線'); return; }

                    const key = getNoteKey(spotId);
                    db.ref(key).once('value').then(snap => {
                        const notes = snap.val() || [];
                        notes.push({ text, time: Date.now() });
                        db.ref(key).set(notes);
                    });
                    input.value = '';
                });
            });

            // 團友筆記監聽
            document.querySelectorAll('.spot-card').forEach(card => {
                const spotId = card.dataset.spotId;
                if (!spotId || !db) return;
                const key = getNoteKey(spotId);
                const listId = `note-list-${spotId}`;
                const emptyId = `note-empty-${spotId}`;

                db.ref(key).on('value', (snap) => {
                    const notes = snap.val() || [];
                    const list = document.getElementById(listId);
                    const empty = document.getElementById(emptyId);
                    if (!list) return;

                    if (notes.length === 0) {
                        if (empty) empty.style.display = 'block';
                        list.innerHTML = '';
                        return;
                    }
                    if (empty) empty.style.display = 'none';

                    let html = '';
                    notes.forEach((note, idx) => {
                        const text = note.text || '';
                        html += `
                            <div class="note-item">
                                <span class="note-text">${escapeHtml(text)}</span>
                                <button class="del-btn" data-spot="${spotId}" data-idx="${idx}">✕</button>
                            </div>
                        `;
                    });
                    list.innerHTML = html;

                    list.querySelectorAll('.del-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const spot = this.dataset.spot;
                            const idx = parseInt(this.dataset.idx);
                            if (!db) return;
                            const key = getNoteKey(spot);
                            db.ref(key).once('value').then(snap => {
                                const arr = snap.val() || [];
                                arr.splice(idx, 1);
                                db.ref(key).set(arr);
                            });
                        });
                    });
                });
            });
        }

        // ================================================================

                            <div class="section-title">⚠️ 避坑提醒</div>

                        </div>

                        </div>
                        <div class="note-section">
                            <div class="note-title">✏️ 團友筆記（4人同步）</div>
                            <div class="note-input-row">
                                <input type="text" id="note-input-${spotId}" placeholder="寫低你嘅觀察、感受、補充⋯" />

                            </div>
                            <div class="note-list" id="note-list-${spotId}"></div>
                            <div class="note-list empty-msg" id="note-empty-${spotId}">💬 未有筆記，你嚟加第一條！</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================================================================
        //  返回頂部功能
        // ================================================================
        const backToTopBtn = document.getElementById('backToTopBtn');

        window.addEventListener('scroll', function() {
            if (window.scrollY > 500) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        });

        backToTopBtn.addEventListener('click', function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // ================================================================
        //  啟動
        // ================================================================
        loadGuideData();
        console.log('📖 導遊筆記已啟動！');
        if (!db) console.warn('⚠️ Firebase 未連線');
        else console.log('✅ Firebase 已連線');
    </script>

</body>
</html>
