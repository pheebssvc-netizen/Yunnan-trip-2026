<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>神算醒 · 雲南滇西12日</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>

    <!-- 共用樣式 -->
    <link rel="stylesheet" href="style.css" />

    <!-- ===== 共用 JavaScript (控制倒數、海拔線等) ===== -->
    <script src="app.js"></script>

    <style>
        .bill-card {
            background: #fff;
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .bill-card h3 {
            font-size: 1.0rem;
            color: #E07A5F;
            border-left: 5px solid #E9C46A;
            padding-left: 12px;
            margin-bottom: 12px;
        }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .status-dot.online {
            background: #2ECC71;
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.5);
        }
        .status-dot.offline {
            background: #F39C12;
            box-shadow: 0 0 8px rgba(243, 156, 18, 0.5);
        }
        .status-label {
            font-size: 0.75rem;
            color: #6B5A4A;
            vertical-align: middle;
        }
        .settlement-list {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;
        }
        .settlement-list li {
            padding: 6px 0;
            font-size: 0.95rem;
            border-bottom: 1px solid #F5F0EB;
            display: flex;
            justify-content: space-between;
        }
        .settlement-list li:last-child {
            border-bottom: none;
        }
        .settlement-amount {
            font-weight: 700;
            color: #2D241A;
        }
        .settlement-clear {
            text-align: center;
            color: #2ECC71;
            font-weight: 600;
            font-size: 1.05rem;
            padding: 8px 0;
        }
        .total-spend {
            font-size: 0.85rem;
            color: #6B5A4A;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #EDE7E0;
            padding-top: 8px;
        }
        .total-spend strong {
            color: #2D241A;
        }
        .bill-form .form-row {
            margin-bottom: 12px;
        }
        .bill-form .form-row label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #6B5A4A;
            margin-bottom: 4px;
        }
        .bill-form .form-row input[type="date"],
        .bill-form .form-row input[type="number"],
        .bill-form .form-row input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1.5px solid #EDE7E0;
            font-size: 0.95rem;
            background: #FFFBF5;
            transition: 0.15s;
            outline: none;
            font-family: inherit;
        }
        .bill-form .form-row input:focus {
            border-color: #E07A5F;
            background: #fff;
        }
        .bill-form .form-row input[type="number"] {
            font-size: 1.3rem;
            font-weight: 600;
        }

        /* ===== 修改點 1：分類按鈕改為兩欄網格 ===== */
        .category-pills {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .category-pills .pill {
            padding: 8px 12px;
            border-radius: 30px;
            border: 2px solid #EDE7E0;
            background: #fff;
            font-size: 0.78rem;
            font-weight: 500;
            color: #6B5A4A;
            cursor: pointer;
            transition: 0.15s;
            user-select: none;
            text-align: center;
        }
        .category-pills .pill:active {
            transform: scale(0.94);
        }
        .category-pills .pill.active {
            background: #E07A5F;
            color: #fff;
            border-color: #E07A5F;
        }

        .payer-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .payer-buttons .payer-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2.5px solid #EDE7E0;
            background: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            color: #6B5A4A;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .payer-buttons .payer-btn:active {
            transform: scale(0.92);
        }
        .payer-buttons .payer-btn.active {
            background: #E07A5F;
            color: #fff;
            border-color: #E07A5F;
            box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.25);
        }
        .participant-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
        }
        .participant-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2D241A;
            cursor: pointer;
        }
        .participant-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #E07A5F;
            cursor: pointer;
        }
        .participant-group .select-all {
            font-size: 0.75rem;
            color: #E07A5F;
            cursor: pointer;
            font-weight: 600;
            margin-left: 4px;
        }
        .btn-add-bill {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: #E07A5F;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.5px;
        }
        .btn-add-bill:active {
            transform: scale(0.96);
            background: #C96A4F;
        }
        .bill-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #F5F0EB;
        }
        .bill-item:last-child {
            border-bottom: none;
        }
        .bill-item .left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }
        .bill-item .left .top {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .bill-item .left .top .cat {
            font-size: 0.7rem;
            background: #F5F0EB;
            padding: 2px 10px;
            border-radius: 30px;
            color: #6B5A4A;
        }
        .bill-item .left .top .desc {
            font-weight: 600;
            font-size: 0.9rem;
            color: #2D241A;
        }
        .bill-item .left .meta {
            font-size: 0.7rem;
            color: #8A7A6A;
        }
        .bill-item .left .note {
            font-size: 0.75rem;
            color: #6B5A4A;
            background: #F5F0EB;
            padding: 2px 10px;
            border-radius: 30px;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bill-item .right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }
        .bill-item .right .amount {
            font-weight: 700;
            font-size: 1.0rem;
            color: #2D241A;
        }
        .bill-item .action-buttons {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }
        .bill-item .action-buttons button {
            background: none;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.15s;
            color: #B5A89A;
        }
        .bill-item .action-buttons .edit-btn:active,
        .bill-item .action-buttons .delete-btn:active {
            transform: scale(0.9);
        }
        .bill-item .action-buttons .edit-btn:hover {
            color: #E07A5F;
        }
        .bill-item .action-buttons .delete-btn:hover {
            color: #E07A5F;
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .filter-bar .filter-btn {
            padding: 4px 14px;
            border-radius: 30px;
            border: 1.5px solid #EDE7E0;
            background: #fff;
            font-size: 0.75rem;
            font-weight: 500;
            color: #6B5A4A;
            cursor: pointer;
            transition: 0.15s;
        }
        .filter-bar .filter-btn:active {
            transform: scale(0.94);
        }
        .filter-bar .filter-btn.active {
            background: #E07A5F;
            color: #fff;
            border-color: #E07A5F;
        }
        .empty-state {
            text-align: center;
            padding: 24px 0;
            color: #B5A89A;
            font-size: 0.9rem;
        }
        .pending-badge {
            font-size: 0.6rem;
            background: #F39C12;
            color: #fff;
            padding: 2px 8px;
            border-radius: 30px;
            margin-left: 6px;
        }
        /* Toast 提示 */
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #2D241A;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            z-index: 9999;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
        }
        /* 人均支出 - 移咗去團隊總支出下面，樣式保持不變 */
        .per-person {
            font-size: 0.85rem;
            color: #6B5A4A;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed #EDE7E0;
            padding-top: 6px;
        }
        .per-person strong {
            color: #2D241A;
        }
        @media (max-width: 480px) {
            .payer-buttons .payer-btn {
                width: 48px;
                height: 48px;
                font-size: 1.0rem;
            }
            .participant-group {
                gap: 10px;
            }
            .bill-item .left .top .desc {
                font-size: 0.82rem;
            }
            .bill-item .right .amount {
                font-size: 0.9rem;
            }
            #toast {
                font-size: 0.85rem;
                padding: 10px 20px;
                bottom: 70px;
            }
            /* 細屏幕兩欄分類仍然適用 */
            .category-pills {
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header" id="heroHeader" style="background-image: url('https://raw.githubusercontent.com/pheebssvc-netizen/Yunnan-trip-2026/main/images/Pudacuo.jpg');">
        <div class="header-overlay"></div>
        <div class="header-content">
            <h1>🌄 雲南滇西12日 · 4人同行</h1>
            <div class="countdown" id="countdown">⏳ 載入中...</div>
            <div class="header-divider">
                <span class="dot"></span>
                <span class="line"></span>
                <span class="dot"></span>
            </div>
            <div class="sub">2026.11.11 – 11.22 ｜ Chill · Hea · 慢慢行</div>
        </div>
    </header>

    <!-- ===== TAB NAV ===== -->
    <nav class="tab-nav">
        <a href="index.html">📋 行程總覽</a>
        <a href="daily.html">📅 每日行程</a>
        <a href="info.html">📌 重要資訊</a>
        <a href="bill.html" class="active">🧾 神算醒</a>
    </nav>

    <!-- ===== PAGE ===== -->
    <div class="page">

        <!-- 快速入帳 -->
        <div class="bill-card">
            <h3>⚡ 快速入帳</h3>
            <form class="bill-form" id="billForm" autocomplete="off">
                <div class="form-row">
                    <label>📅 日期</label>
                    <input type="date" id="billDate" />
                </div>
                <div class="form-row">
                    <label>🏷️ 分類</label>
                    <div class="category-pills" id="categoryPills">
                        <span class="pill" data-cat="breakfast">🍞 早餐</span>
                        <span class="pill" data-cat="lunch">🍱 午餐</span>
                        <span class="pill" data-cat="dinner">🍷 晚餐</span>
                        <span class="pill" data-cat="snack">☕ 咖啡小食</span>
                        <span class="pill" data-cat="ticket">🎟️ 門票</span>
                        <span class="pill" data-cat="transport">🚗 交通</span>
                        <span class="pill" data-cat="other">🛍️ 雜項</span>
                    </div>
                </div>
                <div class="form-row">
                    <label>📝 具體項目（選擇性）</label>
                    <input type="text" id="billDetail" placeholder="例如：大排檔、的士、手信" />
                </div>
                <div class="form-row">
                    <label>👤 誰付款？</label>
                    <div class="payer-buttons" id="payerButtons">
                        <button type="button" class="payer-btn" data-payer="J">J</button>
                        <button type="button" class="payer-btn" data-payer="C">C</button>
                        <button type="button" class="payer-btn" data-payer="K">K</button>
                        <button type="button" class="payer-btn" data-payer="Z">Z</button>
                    </div>
                </div>
                <div class="form-row">
                    <label>💰 金額 (¥)</label>
                    <input type="number" id="billAmount" placeholder="0.00" step="0.01" min="0" />
                </div>
                <div class="form-row">
                    <label>👥 參與人 <span class="select-all" id="selectAllToggle">全選</span></label>
                    <div class="participant-group" id="participantGroup">
                        <label><input type="checkbox" value="J" checked /> J</label>
                        <label><input type="checkbox" value="C" checked /> C</label>
                        <label><input type="checkbox" value="K" checked /> K</label>
                        <label><input type="checkbox" value="Z" checked /> Z</label>
                    </div>
                </div>
                <div class="form-row">
                    <label>📝 備註 (選擇性)</label>
                    <input type="text" id="billNote" placeholder="e.g. 古城餐廳 / 玉龍雪山門票" />
                </div>
                <button type="submit" class="btn-add-bill" id="submitBtn">➕ 記帳</button>
            </form>
        </div>

        <!-- ===== 修改點 3：「歷史消費」改為「消費清單」 ===== -->
        <div class="bill-card">
            <h3>📜 消費清單</h3>
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="today">今日</button>
                <button class="filter-btn" data-filter="breakfast">🍞</button>
                <button class="filter-btn" data-filter="lunch">🍱</button>
                <button class="filter-btn" data-filter="dinner">🍷</button>
                <button class="filter-btn" data-filter="snack">☕</button>
                <button class="filter-btn" data-filter="ticket">🎟️</button>
                <button class="filter-btn" data-filter="transport">🚗</button>
                <button class="filter-btn" data-filter="other">🛍️</button>
            </div>
            <div id="billList">
                <div class="empty-state">📭 未有消費記錄</div>
            </div>
        </div>

        <!-- 結算總覽 -->
        <div class="bill-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <h3 style="margin-bottom:0;">📊 結算總覽</h3>
                <div>
                    <span class="status-dot online" id="statusDot"></span>
                    <span class="status-label" id="statusLabel">連線中...</span>
                </div>
            </div>
            <div id="settlementResult">
                <ul class="settlement-list" id="settlementList">
                    <li style="color:#B5A89A; text-align:center; padding:12px 0;">未有帳單，記第一筆數啦！</li>
                </ul>
            </div>
            <!-- ===== 修改點 2：團隊總支出先顯示，人均支出放下面 ===== -->
            <div class="total-spend">
                <span>🧾 團隊總支出</span>
                <span><strong id="totalSpend">¥0.00</strong></span>
            </div>
            <div class="per-person" id="perPersonRow">
                <span>👤 人均支出 (4人)</span>
                <span><strong id="perPersonAmount">¥0.00</strong></span>
            </div>
        </div>

    </div>

    <!-- ===== Toast 提示 ===== -->
    <div id="toast"></div>

    <!-- ===== 固定地圖按鈕 ===== -->
    <a href="map.html" class="map-fab" id="mapFab" aria-label="查看地圖">
        🗺️
        <span class="tooltip">查看地圖</span>
    </a>

    <!-- ===== 返回頂部按鈕 ===== -->
    <button class="back-to-top" id="backToTopBtn" aria-label="返回頂部">⬆</button>

    <script>

        // ================================================================
        //  記帳邏輯（完全保留原有功能）
        // ================================================================
        const MEMBERS = ['J', 'C', 'K', 'Z'];
        const CATEGORY_LABELS = { breakfast: '早餐', lunch: '午餐', dinner: '晚餐', snack: '咖啡小食', ticket: '門票', transport: '交通', other: '雜項' };
        const CATEGORY_ICONS = { breakfast: '🍞', lunch: '🍱', dinner: '🍷', snack: '☕', ticket: '🎟️', transport: '🚗', other: '🛍️' };

        let allBills = [];
        let currentFilter = 'all';
        let isOnline = navigator.onLine;
        let editingId = null;

        const $ = id => document.getElementById(id);
        const billForm = $('billForm');
        const billDate = $('billDate');
        const categoryPills = $('categoryPills');
        const payerButtons = $('payerButtons');
        const billAmount = $('billAmount');
        const billDetail = $('billDetail');
        const billNote = $('billNote');
        const participantGroup = $('participantGroup');
        const selectAllToggle = $('selectAllToggle');
        const billList = $('billList');
        const settlementList = $('settlementList');
        const totalSpend = $('totalSpend');
        const perPersonAmount = $('perPersonAmount');
        const statusDot = $('statusDot');
        const statusLabel = $('statusLabel');
        const filterBar = $('filterBar');
        const submitBtn = $('submitBtn');

        function showToast(msg, duration = 2000) {
            const toast = $('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        function initForm() {
            const today = new Date();
            billDate.value = today.toISOString().split('T')[0];
            const firstPill = categoryPills.querySelector('.pill');
            if (firstPill) firstPill.classList.add('active');
            const firstPayer = payerButtons.querySelector('.payer-btn');
            if (firstPayer) firstPayer.classList.add('active');
            updateSelectAllText();
            categoryPills.querySelectorAll('.pill').forEach(el => {
                el.addEventListener('click', function() {
                    categoryPills.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                });
            });
            payerButtons.querySelectorAll('.payer-btn').forEach(el => {
                el.addEventListener('click', function() {
                    payerButtons.querySelectorAll('.payer-btn').forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                });
            });
            selectAllToggle.addEventListener('click', function() {
                const checks = participantGroup.querySelectorAll('input[type="checkbox"]');
                const allChecked = Array.from(checks).every(c => c.checked);
                checks.forEach(c => c.checked = !allChecked);
                updateSelectAllText();
            });
            participantGroup.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', updateSelectAllText);
            });
            billForm.addEventListener('submit', handleAddOrUpdateBill);
        }

        function updateSelectAllText() {
            const checks = participantGroup.querySelectorAll('input[type="checkbox"]');
            const allChecked = Array.from(checks).every(c => c.checked);
            selectAllToggle.textContent = allChecked ? '全選' : '全部取消';
        }

        function clearForm() {
            billAmount.value = '';
            billDetail.value = '';
            billNote.value = '';
            editingId = null;
            submitBtn.textContent = '➕ 記帳';
        }

        function fillFormForEdit(bill) {
            billDate.value = bill.date;
            categoryPills.querySelectorAll('.pill').forEach(p => {
                p.classList.toggle('active', p.dataset.cat === bill.category);
            });
            payerButtons.querySelectorAll('.payer-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.payer === bill.payer);
            });
            billAmount.value = bill.amount;
            billDetail.value = bill.detail || '';
            billNote.value = bill.note || '';
            participantGroup.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = bill.participants.includes(cb.value);
            });
            updateSelectAllText();
            editingId = bill.id;
            submitBtn.textContent = '💾 更新';
        }

        function handleAddOrUpdateBill(e) {
            e.preventDefault();
            const date = billDate.value;
            if (!date) { alert('請揀日期'); return; }
            const activeCat = categoryPills.querySelector('.pill.active');
            if (!activeCat) { alert('請揀分類'); return; }
            const category = activeCat.dataset.cat;
            const activePayer = payerButtons.querySelector('.payer-btn.active');
            if (!activePayer) { alert('請揀付款人'); return; }
            const payer = activePayer.dataset.payer;
            const amount = parseFloat(billAmount.value);
            if (!amount || amount <= 0) { alert('請輸入有效金額'); return; }
            const participants = [];
            participantGroup.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                participants.push(cb.value);
            });
            if (participants.length === 0) { alert('至少揀一位參與人'); return; }
            const detail = billDetail.value.trim();
            const note = billNote.value.trim();

            const billData = {
                date,
                category,
                categoryLabel: CATEGORY_LABELS[category] || category,
                detail: detail,
                payer,
                amount: Math.round(amount * 100) / 100,
                participants,
                note,
                timestamp: Date.now(),
            };

            if (editingId) {
                updateBill(editingId, billData);
            } else {
                const newBill = {
                    ...billData,
                    id: 'local_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6)
                };
                savePendingBill(newBill);
                allBills.push(newBill);
                sortBills();
                renderAll();
                if (isOnline) syncPendingBills();
                showToast('✅ 記帳成功！');
            }
            clearForm();
            billAmount.focus();
        }

        function updateBill(id, newData) {
            let index = allBills.findIndex(b => b.id === id);
            if (index !== -1) {
                const old = allBills[index];
                const updated = { ...old, ...newData, timestamp: old.timestamp };
                allBills[index] = updated;
                if (!id.startsWith('local_')) {
                    db.ref('trip-bills/' + id).update(newData).catch(err => console.warn('更新 Firebase 失敗', err));
                } else {
                    const pending = getPendingBills();
                    const pIndex = pending.findIndex(b => b.id === id);
                    if (pIndex !== -1) {
                        pending[pIndex] = { ...pending[pIndex], ...newData };
                        localStorage.setItem('pendingBills', JSON.stringify(pending));
                    }
                }
                sortBills();
                renderAll();
                showToast('✅ 更新成功！');
            } else {
                alert('搵唔到要更新嘅帳單');
            }
        }

        function savePendingBill(bill) {
            const pending = JSON.parse(localStorage.getItem('pendingBills') || '[]');
            pending.push(bill);
            localStorage.setItem('pendingBills', JSON.stringify(pending));
        }

        function getPendingBills() {
            return JSON.parse(localStorage.getItem('pendingBills') || '[]');
        }

        function syncPendingBills() {
            if (!isOnline) return;
            const pending = getPendingBills();
            if (pending.length === 0) return;
            const billsRef = db.ref('trip-bills');
            pending.forEach((bill, index) => {
                const { id, ...billData } = bill;
                billsRef.push(billData, (error) => {
                    if (!error) {
                        const current = getPendingBills();
                        const updated = current.filter((_, i) => i !== index);
                        localStorage.setItem('pendingBills', JSON.stringify(updated));
                    }
                });
            });
        }

        function loadFromFirebase() {
            const billsRef = db.ref('trip-bills');
            billsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                const firebaseBills = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        firebaseBills.push({ id: key, ...data[key] });
                    });
                }
                const pending = getPendingBills();
                const all = [...firebaseBills, ...pending];
                const unique = [];
                const seen = new Set();
                all.forEach(b => {
                    const key = b.timestamp + '_' + b.amount + '_' + b.payer + '_' + b.category;
                    if (!seen.has(key)) {
                        seen.add(key);
                        unique.push(b);
                    }
                });
                allBills = unique;
                sortBills();
                renderAll();
                updateOnlineStatus(true);
            }, (error) => {
                console.warn('Firebase 讀取失敗，使用本地數據', error);
                const pending = getPendingBills();
                if (pending.length > 0) {
                    allBills = pending;
                    sortBills();
                    renderAll();
                }
                updateOnlineStatus(false);
            });
        }

        function sortBills() {
            allBills.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        }

        function renderAll() {
            renderSettlement();
            renderBillList();
            renderTotalAndPerPerson();
        }

        function getDisplayCategory(bill) {
            const icon = CATEGORY_ICONS[bill.category] || '📌';
            const label = bill.categoryLabel || bill.category;
            if (bill.detail) {
                return `${icon} ${label} - ${bill.detail}`;
            }
            return `${icon} ${label}`;
        }

        function renderSettlement() {
            if (allBills.length === 0) {
                settlementList.innerHTML = `<li style="color:#B5A89A; text-align:center; padding:12px 0;">未有帳單，記第一筆數啦！</li>`;
                return;
            }
            const balance = {};
            MEMBERS.forEach(m => balance[m] = 0);
            allBills.forEach(bill => {
                const share = bill.amount / bill.participants.length;
                bill.participants.forEach(p => { if (balance[p] !== undefined) balance[p] -= share; });
                if (balance[bill.payer] !== undefined) balance[bill.payer] += bill.amount;
            });
            const debtors = [];
            const creditors = [];
            MEMBERS.forEach(m => {
                if (balance[m] < -0.005) debtors.push({ name: m, amt: -balance[m] });
                if (balance[m] > 0.005) creditors.push({ name: m, amt: balance[m] });
            });
            const transactions = [];
            let i = 0, j = 0;
            while (i < debtors.length && j < creditors.length) {
                const d = debtors[i];
                const c = creditors[j];
                const amount = Math.min(d.amt, c.amt);
                if (amount > 0.005) {
                    transactions.push({ from: d.name, to: c.name, amount: Math.round(amount * 100) / 100 });
                }
                d.amt -= amount;
                c.amt -= amount;
                if (d.amt < 0.005) i++;
                if (c.amt < 0.005) j++;
            }
            if (transactions.length === 0) {
                settlementList.innerHTML = `<li class="settlement-clear">🎉 數已清，冇拖冇欠！</li>`;
            } else {
                let html = '';
                transactions.forEach(t => {
                    html += `<li><span>👉 <strong>${t.from}</strong> 俾 <strong>${t.to}</strong></span><span class="settlement-amount">¥${t.amount.toFixed(2)}</span></li>`;
                });
                settlementList.innerHTML = html;
            }
        }

        function renderBillList() {
            let filtered = [...allBills];
            if (currentFilter === 'today') {
                const today = new Date().toISOString().split('T')[0];
                filtered = filtered.filter(b => b.date === today);
            } else if (currentFilter !== 'all') {
                filtered = filtered.filter(b => b.category === currentFilter);
            }
            if (filtered.length === 0) {
                billList.innerHTML = `<div class="empty-state">📭 沒有符合嘅記錄</div>`;
                return;
            }
            let html = '';
            filtered.forEach(bill => {
                const displayCat = getDisplayCategory(bill);
                const participantsStr = bill.participants.join(', ');
                const isPending = bill.id && bill.id.startsWith('local_');
                const pendingBadge = isPending ? `<span class="pending-badge">⏳ 同步中</span>` : '';
                const noteHtml = bill.note ? `<span class="note">📝 ${bill.note}</span>` : '';
                html += `<div class="bill-item">
                            <div class="left">
                                <div class="top">
                                    <span class="cat">${displayCat}</span>
                                    <span class="desc">${bill.date}</span>
                                    ${pendingBadge}
                                </div>
                                <div class="meta">👤 ${bill.payer} ｜ 👥 ${participantsStr}</div>
                                ${noteHtml}
                            </div>
                            <div class="right">
                                <div class="amount">¥${bill.amount.toFixed(2)}</div>
                                <div class="action-buttons">
                                    <button class="edit-btn" data-id="${bill.id}">✎ 編輯</button>
                                    <button class="delete-btn" data-id="${bill.id}">✕</button>
                                </div>
                            </div>
                        </div>`;
            });
            billList.innerHTML = html;
            billList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    deleteBill(id);
                });
            });
            billList.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const bill = allBills.find(b => b.id === id);
                    if (bill) {
                        fillFormForEdit(bill);
                        document.querySelector('.bill-card').scrollIntoView({ behavior: 'smooth' });
                    } else {
                        alert('搵唔到呢筆記錄');
                    }
                });
            });
        }

        function renderTotalAndPerPerson() {
            const total = allBills.reduce((sum, b) => sum + b.amount, 0);
            totalSpend.textContent = '¥' + total.toFixed(2);
            const perPerson = total / MEMBERS.length;
            perPersonAmount.textContent = '¥' + perPerson.toFixed(2);
        }

        function deleteBill(id) {
            if (!confirm('確定刪除呢筆記錄？')) return;
            allBills = allBills.filter(b => b.id !== id);
            if (!id.startsWith('local_')) {
                db.ref('trip-bills/' + id).remove().catch(err => console.warn('刪除失敗', err));
            } else {
                const pending = getPendingBills();
                const updated = pending.filter(b => b.id !== id);
                localStorage.setItem('pendingBills', JSON.stringify(updated));
            }
            renderAll();
            showToast('🗑️ 已刪除');
        }

        function updateOnlineStatus(online) {
            isOnline = online;
            if (online) {
                statusDot.className = 'status-dot online';
                statusLabel.textContent = '🟢 在線同步中';
            } else {
                statusDot.className = 'status-dot offline';
                statusLabel.textContent = '🟠 離線儲存中';
            }
        }

        function initNetworkListener() {
            window.addEventListener('online', () => {
                updateOnlineStatus(true);
                syncPendingBills();
                loadFromFirebase();
            });
            window.addEventListener('offline', () => {
                updateOnlineStatus(false);
            });
            updateOnlineStatus(navigator.onLine);
            const connectedRef = db.ref('.info/connected');
            connectedRef.on('value', (snap) => {
                const connected = snap.val() === true;
                updateOnlineStatus(connected);
                if (connected) syncPendingBills();
            });
        }

        function initFilter() {
            filterBar.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderBillList();
                });
            });
        }

        function init() {
            initForm();
            initFilter();
            initNetworkListener();
            loadFromFirebase();
            if (navigator.onLine) setTimeout(syncPendingBills, 2000);
        }

        document.addEventListener('DOMContentLoaded', init);

        // 返回頂部
        const backToTopBtn = document.getElementById('backToTopBtn');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        });
        backToTopBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>

</body>
</html>
