<html lang="zh-HK">

    <!-- Firebase SDK v9 compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">

    <style>
        /* reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #F9F6F0;
            color: #2D241A;
            padding-bottom: 80px;
        }
        .app-header {
            position: relative;
            background-size: cover;
            background-position: center 20%;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 16px 30px;
        }
        .header-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(30, 20, 15, 0.5) 0%, rgba(0, 0, 0, 0.25) 100%);
            border-radius: 0 0 30px 30px;
        }
        .header-content {
            position: relative;
            z-index: 2;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            width: 100%;
        }
        .header-content h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .countdown {
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 8px 18px;
            border-radius: 40px;
            display: inline-block;
            margin: 10px 0 6px;
            font-weight: 500;
        }
        .header-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 4px;
        }
        .header-divider .line {
            width: 60px;
            height: 2px;
            background: #E9C46A;
            border-radius: 2px;
        }
        .header-divider .dot {
            width: 8px;
            height: 8px;
            background: #E9C46A;
            border-radius: 50%;
        }
        .sub {
            font-size: 0.95rem;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        /* tab nav */
        .tab-nav {
            display: flex;
            background: #fff;
            border-bottom: 1px solid #E8E0D8;
            padding: 6px 12px;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(6px);
        }
        .tab-nav a {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #6B5A4A;
            text-decoration: none;
            transition: 0.15s;
            background: transparent;
        }
        .tab-nav a.active {
            background: #E07A5F;
            color: #fff;
        }
        .tab-nav a:active {
            transform: scale(0.94);
        }

        .page {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px 14px 30px;
        }

        /* card */
        .bill-card {
            background: #fff;
            border-radius: 24px;
            padding: 16px 18px;
            margin-bottom: 18px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid #F0EAE2;
        }
        .bill-card h3 {
            font-size: 1.0rem;
            color: #E07A5F;
            border-left: 5px solid #E9C46A;
            padding-left: 12px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .status-dot.online {
            background: #2ECC71;
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.4);
        }
        .status-dot.offline {
            background: #F39C12;
            box-shadow: 0 0 8px rgba(243, 156, 18, 0.4);
        }
        .status-label {
            font-size: 0.75rem;
            color: #6B5A4A;
            vertical-align: middle;
        }
        .settlement-list {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;
        }
        .settlement-list li {
            padding: 6px 0;
            font-size: 0.95rem;
            border-bottom: 1px solid #F5F0EB;
            display: flex;
            justify-content: space-between;
        }
        .settlement-list li:last-child {
            border-bottom: none;
        }
        .settlement-amount {
            font-weight: 700;
            color: #2D241A;
        }
        .settlement-clear {
            text-align: center;
            color: #2ECC71;
            font-weight: 600;
            font-size: 1.05rem;
            padding: 8px 0;
        }
        .total-spend {
            font-size: 0.85rem;
            color: #6B5A4A;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #EDE7E0;
            padding-top: 10px;
        }
        .total-spend strong {
            color: #2D241A;
        }
        .bill-form .form-row {
            margin-bottom: 14px;
        }
        .bill-form .form-row label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #6B5A4A;
            margin-bottom: 5px;
        }
        .bill-form .form-row input[type="date"],
        .bill-form .form-row input[type="number"],
        .bill-form .form-row input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1.5px solid #EDE7E0;
            font-size: 0.95rem;
            background: #FFFBF5;
            transition: 0.15s;
            outline: none;
            font-family: inherit;
        }
        .bill-form .form-row input:focus {
            border-color: #E07A5F;
            background: #fff;
        }
        .bill-form .form-row input[type="number"] {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .category-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .category-pills .pill {
            padding: 6px 14px;
            border-radius: 30px;
            border: 2px solid #EDE7E0;
            background: #fff;
            font-size: 0.78rem;
            font-weight: 500;
            color: #6B5A4A;
            cursor: pointer;
            transition: 0.1s;
            user-select: none;
        }
        .category-pills .pill:active {
            transform: scale(0.94);
        }
        .category-pills .pill.active {
            background: #E07A5F;
            color: #fff;
            border-color: #E07A5F;
        }
        .payer-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .payer-buttons .payer-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2.5px solid #EDE7E0;
            background: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            color: #6B5A4A;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .payer-buttons .payer-btn:active {
            transform: scale(0.92);
        }
        .payer-buttons .payer-btn.active {
            background: #E07A5F;
            color: #fff;
            border-color: #E07A5F;
            box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.25);
        }
        .participant-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
        }
        .participant-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2D241A;

        .participant-group input[type="checkbox"] {

            accent-color: #E07A5F;

        .participant-group .select-all {

            margin-left: 4px;

            align-items: center;

        .bill-item .left .meta {

        .bill-item .left .note {

            color: #6B5A4A;
            background: #F5F0EB;

        .bill-item .right {

            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }
        .bill-item .right .amount {
            font-weight: 700;
            font-size: 1.0rem;
            color: #2D241A;
        }
        .bill-item .delete-btn {
            background: none;
            border: none;
            color: #D5C8BC;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 6px;
            transition: 0.15s;
        }
        .bill-item .delete-btn:active {
            color: #E07A5F;
            transform: scale(0.9);
        }
        .filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .filter-bar .filter-btn {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1.5px solid #EDE7E0;
            background: #fff;
            font-size: 0.7rem;
            font-weight: 500;
            color: #6B5A4A;
            cursor: pointer;
            transition: 0.1s;
        }
        .filter-bar .filter-btn:active {
            transform: scale(0.94);
        }
        .filter-bar .filter-btn.active {
            background: #E07A5F;
            color: #fff;
            border-color: #E07A5F;
        }
        .empty-state {
            text-align: center;
            padding: 24px 0;
            color: #B5A89A;
            font-size: 0.9rem;

        .pending-badge {
            font-size: 0.6rem;
            background: #F39C12;
            color: #fff;
            padding: 2px 8px;
            border-radius: 30px;
            margin-left: 6px;
        }
        .map-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #E07A5F;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 16px rgba(224, 122, 95, 0.4);
            text-decoration: none;
            transition: 0.2s;
            z-index: 30;
        }
        .map-fab:active {
            transform: scale(0.9);
        }
        .back-to-top {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: rgba(45, 36, 26, 0.7);
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 20px;
            backdrop-filter: blur(4px);
            cursor: pointer;
            opacity: 0;
            transition: 0.2s;
            z-index: 25;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .back-to-top.show {
            opacity: 1;
        }
        .back-to-top:active {
            transform: scale(0.9);
        }
        .sync-status {
            text-align: center;
            font-size: 0.75rem;
            color: #8A7A6A;
            padding: 6px 0 2px;
        }
        .sync-status .synced {
            color: #2ECC71;
        }
        .per-person-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #6B5A4A;
            padding: 6px 0 2px;
            border-bottom: 1px solid #EDE7E0;
        }
        .per-person-row strong {
            color: #2D241A;
        }

        @media (max-width: 480px) {
            .payer-buttons .payer-btn {
                width: 48px;
                height: 48px;
                font-size: 1.0rem;
            }
            .participant-group {
                gap: 10px;
            }
            .bill-item .left .top .desc {
                font-size: 0.82rem;
            }
            .bill-item .right .amount {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header class="app-header" id="heroHeader" style="background-image: url('https://raw.githubusercontent.com/pheebssvc-netizen/Yunnan-trip-2026/main/images/Pudacuo.jpg');">

    <!-- ===== PAGE ===== -->
    <div class="page">

        <!-- 快速入帳 -->
        <div class="bill-card">
            <h3>⚡ 快速入帳</h3>
            <form class="bill-form" id="billForm" autocomplete="off">
                <div class="form-row">
                    <label>📅 日期</label>
                    <input type="date" id="billDate" />
                </div>
                <div class="form-row">
                    <label>🏷️ 分類</label>
                    <div class="category-pills" id="categoryPills">
                        <span class="pill" data-cat="breakfast">🍞 早餐</span>
                        <span class="pill" data-cat="lunch">🍱 午餐</span>
                        <span class="pill" data-cat="dinner">🍷 晚餐</span>

                </div>
                <div class="form-row">
                    <label>👤 誰付款？</label>
                    <div class="payer-buttons" id="payerButtons">

                        <button type="button" class="payer-btn" data-payer="C">C</button>
                        <button type="button" class="payer-btn" data-payer="K">K</button>
                        <button type="button" class="payer-btn" data-payer="Z">Z</button>
                    </div>
                </div>
                <div class="form-row">
                    <label>💰 金額 (¥)</label>

                <div class="form-row">

                    <div class="participant-group" id="participantGroup">
                        <label><input type="checkbox" value="J" checked /> J</label>
                        <label><input type="checkbox" value="C" checked /> C</label>
                        <label><input type="checkbox" value="K" checked /> K</label>
                        <label><input type="checkbox" value="Z" checked /> Z</label>
                    </div>
                </div>
                <div class="form-row">
                    <label>📝 備註 (選擇性)</label>
                    <input type="text" id="billNote" placeholder="e.g. 古城餐廳 / 玉龍雪山門票" />

                <button type="submit" class="btn-add-bill">➕ 記帳</button>

        </div>

        <!-- 歷史消費 -->
        <div class="bill-card">

                <button class="filter-btn" data-filter="today">今日</button>
                <button class="filter-btn" data-filter="breakfast">🍞</button>
                <button class="filter-btn" data-filter="lunch">🍱</button>
                <button class="filter-btn" data-filter="dinner">🍷</button>
                <button class="filter-btn" data-filter="snack">☕</button>
                <button class="filter-btn" data-filter="ticket">🎟️</button>
                <button class="filter-btn" data-filter="transport">🚗</button>
                <button class="filter-btn" data-filter="other">🛍️</button>

            <div id="billList">

        </div>

        <!-- 結算總覽 -->
        <div class="bill-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">

            </div>
            <div class="total-spend">
                <span>🧾 團隊總支出</span>
                <span><strong id="totalSpend">¥0.00</strong></span>
            </div>
            <div class="sync-status" id="syncStatus">⏳ 同步中...</div>

    <a href="map.html" class="map-fab" id="mapFab" aria-label="查看地圖">

        // ================================================================

        // ================================================================
        const firebaseConfig = {

            authDomain: "yunnan-trip-d5626.firebaseapp.com",
            databaseURL: "https://yunnan-trip-d5626-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "yunnan-trip-d5626",
            storageBucket: "yunnan-trip-d5626.firebasestorage.app",
            messagingSenderId: "956753515518",
            appId: "1:956753515518:web:ef19ac8a7b45bdf83426af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ================================================================

        const MEMBERS = ['J', 'C', 'K', 'Z'];
        const CATEGORY_LABELS = { breakfast: '早餐', lunch: '午餐', dinner: '晚餐', snack: '咖啡小食', ticket: '門票', transport: '交通', other: '雜項' };
        const CATEGORY_ICONS = { breakfast: '🍞', lunch: '🍱', dinner: '🍷', snack: '☕', ticket: '🎟️', transport: '🚗', other: '🛍️' };

        const $ = id => document.getElementById(id);
        const billForm = $('billForm');

        // 倒數
        function updateCountdown() {
            const target = new Date('2026-11-11T00:00:00+08:00');
            const now = new Date();
            const diff = target - now;
            if (diff <= 0) {
                document.getElementById('countdown').textContent = '🎉 旅程進行中！';
                return;
            }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / (1000 * 60)) % 60);
            document.getElementById('countdown').textContent = `⏳ ${days}天 ${hours}小時 ${mins}分`;
        }
        updateCountdown();
        setInterval(updateCountdown, 60000);

        // 初始化日期為今天
        function setDefaultDate() {
            const today = new Date();
            billDate.value = today.toISOString().split('T')[0];
        }

        // 分類點擊：自動填入備註（分類名稱）
        function setupCategoryPills() {
            categoryPills.querySelectorAll('.pill').forEach(el => {
                el.addEventListener('click', function() {
                    categoryPills.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                    // 如果備註欄為空，自動填入分類名稱
                    const cat = this.dataset.cat;
                    const label = CATEGORY_LABELS[cat] || cat;
                    if (billNote.value.trim() === '') {
                        billNote.value = label;
                    }
                });
            });
        }

        function initForm() {
            setDefaultDate();
            const firstPill = categoryPills.querySelector('.pill');
            if (firstPill) firstPill.classList.add('active');
            const firstPayer = payerButtons.querySelector('.payer-btn');
            if (firstPayer) firstPayer.classList.add('active');
            updateSelectAllText();
            setupCategoryPills();

            payerButtons.querySelectorAll('.payer-btn').forEach(el => {
                el.addEventListener('click', function() {
                    payerButtons.querySelectorAll('.payer-btn').forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                });
            });
            selectAllToggle.addEventListener('click', function() {
                const checks = participantGroup.querySelectorAll('input[type="checkbox"]');
                const allChecked = Array.from(checks).every(c => c.checked);
                checks.forEach(c => c.checked = !allChecked);
                updateSelectAllText();
            });
            participantGroup.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', updateSelectAllText);
            });
            billForm.addEventListener('submit', handleAddBill);
        }

        function updateSelectAllText() {
            const checks = participantGroup.querySelectorAll('input[type="checkbox"]');
            const allChecked = Array.from(checks).every(c => c.checked);
            selectAllToggle.textContent = allChecked ? '全選' : '全部取消';
        }

        function handleAddBill(e) {
            e.preventDefault();
            const date = billDate.value;
            if (!date) { alert('請揀日期'); return; }
            const activeCat = categoryPills.querySelector('.pill.active');
            if (!activeCat) { alert('請揀分類'); return; }
            const category = activeCat.dataset.cat;
            const activePayer = payerButtons.querySelector('.payer-btn.active');
            if (!activePayer) { alert('請揀付款人'); return; }
            const payer = activePayer.dataset.payer;
            const amount = parseFloat(billAmount.value);
            if (!amount || amount <= 0) { alert('請輸入有效金額'); return; }
            const participants = [];
            participantGroup.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                participants.push(cb.value);
            });
            if (participants.length === 0) { alert('至少揀一位參與人'); return; }
            const note = billNote.value.trim();

            const bill = {
                date, category, categoryLabel: CATEGORY_LABELS[category] || category,
                payer, amount: Math.round(amount * 100) / 100,
                participants, note,
                timestamp: Date.now(),
                id: 'local_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6)
            };
            savePendingBill(bill);
            allBills.push(bill);
            sortBills();
            renderAll();
            if (isOnline) syncPendingBills();
            billAmount.value = '';
            billNote.value = '';
            // 重置分類高亮，但保留第一個為active
            categoryPills.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            const firstPill = categoryPills.querySelector('.pill');
            if (firstPill) firstPill.classList.add('active');
            billAmount.focus();
        }

        function savePendingBill(bill) {
            const pending = JSON.parse(localStorage.getItem('pendingBills') || '[]');
            pending.push(bill);
            localStorage.setItem('pendingBills', JSON.stringify(pending));
        }

        function getPendingBills() {
            return JSON.parse(localStorage.getItem('pendingBills') || '[]');
        }

        function syncPendingBills() {
            if (!isOnline) return;
            const pending = getPendingBills();
            if (pending.length === 0) return;
            const billsRef = db.ref('trip-bills');
            // 逐筆上傳，並移除已同步的本地記錄
            const toRemove = [];
            pending.forEach((bill, index) => {
                const { id, ...billData } = bill;
                billsRef.push(billData, (error) => {
                    if (!error) {
                        toRemove.push(index);
                    }
                });
            });
            // 延遲移除已同步的記錄
            setTimeout(() => {
                if (toRemove.length > 0) {
                    const current = getPendingBills();
                    const updated = current.filter((_, i) => !toRemove.includes(i));
                    localStorage.setItem('pendingBills', JSON.stringify(updated));
                }
            }, 1500);
        }

        function loadFromFirebase() {
            const billsRef = db.ref('trip-bills');
            billsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                const firebaseBills = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        firebaseBills.push({ id: key, ...data[key] });
                    });
                }
                const pending = getPendingBills();
                const all = [...firebaseBills, ...pending];
                // 去重（基於 timestamp + amount + payer + category）
                const unique = [];
                const seen = new Set();
                all.forEach(b => {
                    const key = b.timestamp + '_' + b.amount + '_' + b.payer + '_' + b.category;
                    if (!seen.has(key)) {
                        seen.add(key);
                        unique.push(b);
                    }
                });
                allBills = unique;
                sortBills();
                renderAll();
                updateOnlineStatus(true);
                syncStatus.innerHTML = '✅ 已同步 (' + allBills.length + ' 筆)';
            }, (error) => {
                console.warn('Firebase 讀取失敗，使用本地數據', error);
                const pending = getPendingBills();
                if (pending.length > 0) {
                    allBills = pending;
                    sortBills();
                    renderAll();
                }
                updateOnlineStatus(false);
                syncStatus.innerHTML = '⚠️ 離線模式 (' + allBills.length + ' 筆)';
            });
        }

        function sortBills() {
            allBills.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        }

        function renderAll() {
            renderSettlement();
            renderBillList();
            renderTotalSpend();
        }
